<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Sky & Campus Lighting Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCEBF8"/>
      <stop offset="40%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#E2E9F0"/>
    </linearGradient>

    <!-- Brick Building Wall Texture Gradients -->
    <linearGradient id="brickBuildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A54F38"/>
      <stop offset="50%" stop-color="#8C3B26"/>
      <stop offset="100%" stop-color="#6E2C1B"/>
    </linearGradient>

    <linearGradient id="brickShadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#732F1E"/>
      <stop offset="100%" stop-color="#4E1E12"/>
    </linearGradient>

    <!-- Glass & Window Reflections -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Campus Lawn & Greenery -->
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Paved Walkway -->
    <linearGradient id="pavementGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- CampusLink Floating Glassmorphism Dashboard Shell -->
    <linearGradient id="dashBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Brand Cyan & Indigo Accents -->
    <linearGradient id="cyanButtonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2C8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="blueButtonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. SCENERY BACKGROUND: Photorealistic Campus Architecture -->
  <!-- Sky -->
  <rect width="1600" height="550" fill="url(#skyGrad)"/>

  <!-- Left Brick Academic Hall -->
  <g id="leftBuilding">
    <rect x="-50" y="80" width="480" height="480" fill="url(#brickBuildingGrad)"/>
    <!-- Roof Trim -->
    <rect x="-60" y="70" width="500" height="18" fill="#F1F5F9"/>
    <!-- Windows Matrix -->
    <g fill="url(#windowGrad)">
      <!-- Row 1 -->
      <rect x="20" y="120" width="65" height="110" rx="4"/>
      <rect x="110" y="120" width="65" height="110" rx="4"/>
      <rect x="200" y="120" width="65" height="110" rx="4"/>
      <rect x="290" y="120" width="65" height="110" rx="4"/>
      <!-- Row 2 -->
      <rect x="20" y="260" width="65" height="110" rx="4"/>
      <rect x="110" y="260" width="65" height="110" rx="4"/>
      <rect x="200" y="260" width="65" height="110" rx="4"/>
      <rect x="290" y="260" width="65" height="110" rx="4"/>
      <!-- Row 3 -->
      <rect x="20" y="400" width="65" height="110" rx="4"/>
      <rect x="110" y="400" width="65" height="110" rx="4"/>
      <rect x="200" y="400" width="65" height="110" rx="4"/>
      <rect x="290" y="400" width="65" height="110" rx="4"/>
    </g>
  </g>

  <!-- Right Central Library / Administration Building -->
  <g id="rightBuilding">
    <rect x="950" y="40" width="700" height="520" fill="url(#brickShadowGrad)"/>
    <!-- Glass Facade Windows -->
    <g fill="url(#windowGrad)">
      <rect x="1000" y="90" width="120" height="420" rx="6"/>
      <rect x="1150" y="90" width="120" height="420" rx="6"/>
      <rect x="1300" y="90" width="120" height="420" rx="6"/>
      <rect x="1450" y="90" width="120" height="420" rx="6"/>
    </g>
  </g>

  <!-- Background Connecting Archway & Trees -->
  <rect x="420" y="220" width="540" height="280" fill="url(#brickBuildingGrad)"/>
  <!-- Arch Entrance -->
  <path d="M 580 500 L 580 340 A 110 110 0 0 1 800 340 L 800 500 Z" fill="#334155"/>

  <!-- Lush Green Lawns & Trees -->
  <circle cx="120" cy="480" r="140" fill="#16A34A" opacity="0.85"/>
  <circle cx="280" cy="510" r="160" fill="#15803D" opacity="0.9"/>
  <circle cx="1480" cy="490" r="150" fill="#16A34A" opacity="0.85"/>

  <!-- Campus Paved Plaza & Lawn Ground -->
  <path d="M -100 520 L 1700 520 L 1700 900 L -100 900 Z" fill="url(#pavementGrad)"/>
  <path d="M -100 520 L 480 520 L 380 680 L -100 720 Z" fill="url(#lawnGrad)"/>
  <path d="M 1200 520 L 1700 520 L 1700 750 L 1350 700 Z" fill="url(#lawnGrad)"/>

  <!-- Courtyard Brick Wall Pedestal Behind Table -->
  <rect x="440" y="580" width="720" height="60" rx="4" fill="url(#brickBuildingGrad)" filter="url(#softShadow)"/>
  <rect x="430" y="570" width="740" height="15" rx="3" fill="#E2E8F0"/>

  <!-- 2. FLOATING CAMPUSLINK DASHBOARD CARD (Center Glass Overlay) -->
  <g filter="url(#heroShadow)">
    <!-- Dashboard Main Frame -->
    <rect x="420" y="80" width="760" height="420" rx="16" fill="url(#dashBgGrad)" stroke="#475569" stroke-width="2" stroke-opacity="0.8"/>
    
    <!-- Top Bar -->
    <rect x="420" y="80" width="760" height="48" rx="16" fill="#0F172A"/>
    <rect x="420" y="112" width="760" height="16" fill="#0F172A"/>
    <line x1="420" y1="128" x2="1180" y2="128" stroke="#334155" stroke-width="1"/>

    <!-- App Brand Name in Top Bar -->
    <text x="450" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">Campus<tspan fill="#00D2C8">Link</tspan></text>

    <!-- Top Bar Navigation Controls & Profile -->
    <circle cx="1100" cy="104" r="12" fill="#1E293B"/>
    <path d="M 1096 104 C 1096 100 1104 100 1104 104" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="1136" cy="104" r="14" fill="#E2E8F0"/>
    <circle cx="1136" cy="100" r="5" fill="#475569"/>

    <!-- Dashboard Sidebar -->
    <rect x="420" y="128" width="160" height="372" fill="#0F172A" opacity="0.6"/>
    <line x1="580" y1="128" x2="580" y2="500" stroke="#1E293B" stroke-width="1"/>

    <!-- Sidebar Active Item (Dashboard) -->
    <rect x="432" y="148" width="136" height="36" rx="8" fill="#1E293B"/>
    <rect x="444" y="158" width="16" height="16" rx="3" fill="#00D2C8"/>
    <text x="470" y="171" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#00D2C8">Dashboard</text>

    <!-- Sidebar Inactive Items -->
    <text x="470" y="215" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#94A3B8">Events</text>
    <text x="470" y="255" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#94A3B8">Students</text>
    <text x="470" y="295" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#94A3B8">Analytics</text>

    <!-- Main Dashboard Content Area -->
    <!-- Content Header -->
    <text x="605" y="165" font-family="system-ui, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">Campus Dashboard</text>

    <!-- Login/Action Quick Pill in Top Right -->
    <rect x="1040" y="145" width="115" height="32" rx="8" fill="url(#cyanButtonGrad)"/>
    <text x="1058" y="166" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F172A">Log in dashboard</text>

    <!-- Section Title -->
    <text x="605" y="200" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#E2E8F0">Student Hub</text>

    <!-- 3 Cards Grid inside Dashboard -->
    <!-- Card 1: Events -->
    <rect x="605" y="215" width="170" height="160" rx="12" fill="url(#cardBgGrad)" stroke="#475569" stroke-opacity="0.5"/>
    <text x="620" y="240" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Events</text>
    <text x="620" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">National AI Hackathon</text>
    <text x="620" y="278" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Learning Forum</text>
    <text x="620" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Saturday Oct 18, 2026</text>
    <text x="620" y="314" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">10:00 AM - 05:00 PM</text>
    
    <rect x="620" y="330" width="85" height="28" rx="6" fill="url(#cyanButtonGrad)"/>
    <text x="635" y="348" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#0F172A">Learn More</text>

    <!-- Card 2: Study Groups -->
    <rect x="790" y="215" width="170" height="160" rx="12" fill="url(#cardBgGrad)" stroke="#475569" stroke-opacity="0.5"/>
    <text x="805" y="240" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Study Groups</text>
    <text x="805" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Students oriented for</text>
    <text x="805" y="278" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#00D2C8">Campus Drives</text>
    <rect x="805" y="292" width="90" height="18" rx="4" fill="#1E293B"/>
    <text x="812" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Cloud Engineering</text>
    
    <rect x="805" y="330" width="85" height="28" rx="6" fill="url(#blueButtonGrad)"/>
    <text x="820" y="348" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF">Study More</text>

    <!-- Card 3: News -->
    <rect x="975" y="215" width="180" height="160" rx="12" fill="url(#cardBgGrad)" stroke="#475569" stroke-opacity="0.5"/>
    <text x="990" y="240" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">News</text>
    <!-- Mini News Thumbnail -->
    <rect x="990" y="250" width="150" height="50" rx="6" fill="#1E293B"/>
    <rect x="995" y="255" width="40" height="40" rx="4" fill="#0284C7"/>
    <text x="1042" y="270" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF">Campus Placement</text>
    <text x="1042" y="284" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Record 98% Hired</text>
    
    <text x="990" y="320" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">CampusLink creates accelerated</text>
    <text x="990" y="334" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">connections for all students.</text>
    <text x="990" y="354" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#38BDF8">Read more →</text>

    <!-- Lower Dashboard Banner Bar -->
    <rect x="605" y="390" width="550" height="80" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="625" y="418" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Student Hub Active Status</text>
    <circle cx="910" cy="430" r="16" fill="#1E293B"/>
    <circle cx="980" cy="430" r="16" fill="#1E293B"/>
  </g>

  <!-- 3. OUTDOOR STUDENT STUDY GROUP AT CIRCULAR TABLE (Foreground) -->
  <g id="studentGroup" filter="url(#heroShadow)">
    <!-- Round Metal Table Base & Legs -->
    <rect x="940" y="700" width="20" height="150" fill="#64748B"/>
    <ellipse cx="950" cy="850" rx="140" ry="25" fill="#475569"/>

    <!-- Round Table Top -->
    <ellipse cx="950" cy="700" rx="260" ry="50" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4"/>
    <ellipse cx="950" cy="696" rx="250" ry="44" fill="#F8FAFC"/>

    <!-- Laptops, Smartphones, Tablets on Table -->
    <!-- Student 1 Laptop (Left) -->
    <rect x="780" y="665" width="80" height="40" rx="4" fill="#0F172A" transform="rotate(-10 820 685)"/>
    <rect x="782" y="667" width="76" height="34" rx="2" fill="#38BDF8" transform="rotate(-10 820 685)"/>
    
    <!-- Student 2 Smartphone (Center) -->
    <rect x="935" y="670" width="25" height="42" rx="4" fill="#1E293B"/>
    <rect x="937" y="672" width="21" height="38" rx="2" fill="#00D2C8"/>

    <!-- Student 3 Tablet & Notebook (Right) -->
    <rect x="1030" y="665" width="85" height="45" rx="5" fill="#334155" transform="rotate(8 1070 685)"/>
    <rect x="1033" y="668" width="79" height="39" rx="3" fill="#E0F2FE" transform="rotate(8 1070 685)"/>

    <!-- Student 1 (Female Student on Left with Laptop) -->
    <g id="femaleStudent1">
      <circle cx="700" cy="510" r="32" fill="#F3D5B5"/> <!-- Head -->
      <path d="M 670 490 Q 700 460 730 490 Q 735 560 670 560 Z" fill="#3F2E21"/> <!-- Long Dark Hair -->
      <path d="M 650 560 C 650 540 750 540 750 560 L 730 750 L 670 750 Z" fill="#15803D"/> <!-- Green Top -->
      <path d="M 670 730 L 780 840 L 720 860 L 630 750 Z" fill="#1E3A8A"/> <!-- Jeans -->
    </g>

    <!-- Student 2 (Male Student in Center with Hoodie & Phone) -->
    <g id="maleStudent2">
      <circle cx="950" cy="480" r="34" fill="#8D5B4C"/> <!-- Head -->
      <path d="M 920 450 Q 950 440 980 450 Q 980 480 920 480 Z" fill="#1E1E1E"/> <!-- Short Dark Hair -->
      <path d="M 880 530 C 880 500 1020 500 1020 530 L 1000 740 L 900 740 Z" fill="#475569"/> <!-- Grey Hoodie -->
      <path d="M 920 530 L 980 530 L 960 680 Z" fill="#F8FAFC"/> <!-- Inner T-Shirt -->
      <path d="M 900 740 L 930 870 L 970 870 L 1000 740 Z" fill="#0F172A"/> <!-- Dark Pants -->
    </g>

    <!-- Student 3 (Female Student on Right with Tablet) -->
    <g id="femaleStudent3">
      <circle cx="1200" cy="500" r="32" fill="#FDDFCE"/> <!-- Head -->
      <path d="M 1170 480 Q 1200 450 1230 480 Q 1240 560 1170 560 Z" fill="#2B1D0C"/> <!-- Long Dark Hair -->
      <path d="M 1140 550 C 1140 530 1260 530 1260 550 L 1230 740 L 1170 740 Z" fill="#1E40AF"/> <!-- Blue Hoodie -->
      <path d="M 1170 730 L 1240 850 L 1180 870 L 1120 740 Z" fill="#1D4ED8"/> <!-- Denim Jeans -->
    </g>
  </g>

  <!-- 4. OVERLAY TYPOGRAPHY: "CampusLink - Your Entire Campus, Connected." -->
  <g id="overlayBrandText" filter="url(#heroShadow)">
    <text x="80" y="780" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" letter-spacing="-2">Campus<tspan fill="#00D2C8">Link</tspan></text>
    <text x="80" y="835" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="36" fill="#F1F5F9" letter-spacing="-0.5">Your Entire Campus, Connected.</text>
  </g>
</svg>
