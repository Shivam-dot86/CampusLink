<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Left head spherical gradient -->
    <radialGradient id="leftHead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </radialGradient>

    <!-- Right head spherical gradient -->
    <radialGradient id="rightHead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <!-- Infinity Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="30%" stop-color="#2563EB" />
      <stop offset="55%" stop-color="#0284C7" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Smooth Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- LOGO ICON MARK -->
  <g filter="url(#softGlow)">
    <!-- Left Person Head -->
    <circle cx="115" cy="88" r="28" fill="url(#leftHead)" />

    <!-- Right Person Head -->
    <circle cx="218" cy="72" r="28" fill="url(#rightHead)" />

    <!-- Infinity Loop / Connected Figures Ribbon -->
    <path d="M 115,118
             C 70,118 35,148 35,185
             C 35,225 75,252 118,252
             C 160,252 195,212 225,180
             C 255,148 282,122 322,122
             C 362,122 392,150 392,185
             C 392,222 360,250 320,250
             C 278,250 240,210 208,178
             C 178,148 152,118 115,118 Z
             M 118,212
             C 95,212 75,198 75,185
             C 75,170 92,156 115,156
             C 138,156 158,174 180,195
             C 160,208 140,212 118,212 Z
             M 320,160
             C 342,160 355,172 355,185
             C 355,198 338,212 320,212
             C 298,212 278,194 256,172
             C 278,162 298,160 320,160 Z"
          fill="url(#ribbonGrad)" fill-rule="evenodd" />
  </g>

  <!-- LOGO TEXT: CampusLink -->
  <g transform="translate(420, 185)">
    <!-- "Campus" -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="108" fill="#0A192F" letter-spacing="-2.5">Campus</text>
    
    <!-- "Link" -->
    <text x="382" y="0" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="108" fill="#10B981" letter-spacing="-2.5">Link</text>

    <!-- Subtitle: "AI-POWERED CAMPUS PLACEMENT PLATFORM" -->
    <text x="5" y="52" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="25" fill="#334155" letter-spacing="8">AI-POWERED CAMPUS PLACEMENT PLATFORM</text>
  </g>
</svg>
