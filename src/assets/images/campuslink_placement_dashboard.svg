        <text x="130" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Aug</text>
        <text x="220" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Sep</text>
        <text x="310" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Oct</text>
        <text x="400" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Nov</text>
        <text x="480" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#818CF8" font-weight="600">Current</text>

