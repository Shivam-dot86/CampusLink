            <rect x="12" y="14" width="40" height="40" rx="8" fill="#6366F1" fill-opacity="0.2"/>
            <text x="32" y="39" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#818CF8" text-anchor="middle">GO</text>
            <text x="64" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Google Cloud Drive</text>
            <text x="64" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">SDE-1 &amp; Cloud Trainee · ₹22 LPA</text>
            <rect x="250" y="16" width="72" height="22" rx="6" fill="#10B981" fill-opacity="0.2"/>
            <text x="286" y="31" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">98% AI Match</text>
            <text x="64" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#38BDF8">42 Shortlisted · Interview Round 2</text>
          </g>

          <!-- Drive 2 -->
