    <rect x="24" y="24" width="220" height="627" rx="12" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-opacity="0.5"/>
    
    <!-- Sidebar Header -->
    <rect x="44" y="44" width="32" height="32" rx="8" fill="url(#violetGrad)"/>
    <path d="M52 60 L60 50 L68 60" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" letter-spacing="0.5">CAMPUSLINK</text>

    <!-- Nav Menu Items -->
    <!-- Item 1 (Active) -->
    <rect x="36" y="104" width="196" height="38" rx="8" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-opacity="0.4"/>
    <circle cx="56" cy="123" r="6" fill="#818CF8"/>
    <text x="74" y="128" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#818CF8">Command Center</text>

    <!-- Item 2 -->
    <circle cx="56" cy="165" r="5" fill="#64748B"/>
    <text x="74" y="169" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#94A3B8">Recruiter Drives</text>
