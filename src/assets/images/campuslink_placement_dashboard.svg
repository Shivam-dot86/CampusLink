    <text x="202" y="170" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#34D399" text-anchor="middle">18</text>

    <!-- Item 3 -->
    <circle cx="56" cy="207" r="5" fill="#64748B"/>
    <text x="74" y="211" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#94A3B8">AI Match Engine</text>

    <!-- Item 4 -->
    <circle cx="56" cy="249" r="5" fill="#64748B"/>
    <text x="74" y="253" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#94A3B8">Student Readiness</text>

    <!-- Item 5 -->
    <circle cx="56" cy="291" r="5" fill="#64748B"/>
    <text x="74" y="295" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#94A3B8">APAAR & Digilocker</text>

    <!-- Item 6 -->
