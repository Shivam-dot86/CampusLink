            <rect x="0" y="0" width="336" height="76" rx="8" fill="#0F172A" stroke="#334155"/>
            <rect x="12" y="14" width="40" height="40" rx="8" fill="#059669" fill-opacity="0.2"/>
            <text x="32" y="39" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#34D399" text-anchor="middle">MS</text>
            <text x="64" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Microsoft Azure Campus</text>
            <text x="64" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Systems Engineer · ₹18 LPA</text>
            <rect x="250" y="16" width="72" height="22" rx="6" fill="#6366F1" fill-opacity="0.2"/>
            <text x="286" y="31" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#818CF8" text-anchor="middle">94% AI Match</text>
            <text x="64" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#F59E0B">Lab 3 Scheduled · Tomorrow 10 AM</text>
          </g>

          <!-- Drive 3 -->
          <g transform="translate(16, 242)">
            <rect x="0" y="0" width="336" height="76" rx="8" fill="#0F172A" stroke="#334155"/>
            <rect x="12" y="14" width="40" height="40" rx="8" fill="#D97706" fill-opacity="0.2"/>
            <text x="32" y="39" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#FBBF24" text-anchor="middle">AM</text>
            <text x="64" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Amazon AWS Operations</text>
            <text x="64" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">DevOps Associate · ₹16.5 LPA</text>
            <rect x="250" y="16" width="72" height="22" rx="6" fill="#10B981" fill-opacity="0.2"/>
            <text x="286" y="31" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">92% AI Match</text>
