        <line x1="40" y1="190" x2="490" y2="190" stroke="#334155" stroke-dasharray="4"/>
        <line x1="40" y1="240" x2="490" y2="240" stroke="#334155" stroke-dasharray="4"/>
        <line x1="40" y1="290" x2="490" y2="290" stroke="#334155"/>

