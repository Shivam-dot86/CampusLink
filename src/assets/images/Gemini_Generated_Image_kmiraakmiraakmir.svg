<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Rich campus background environment gradient -->
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="40%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Brick building gradient -->
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>

    <!-- Glassmorphism overlay gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Teal Cyan Glow -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Campus Exterior Background -->
  <rect width="1200" height="675" fill="url(#bgSky)"/>

  <!-- University Buildings (Left & Right) -->
  <rect x="0" y="80" width="340" height="420" fill="url(#brickGrad)" opacity="0.85"/>
  <rect x="20" y="100" width="300" height="380" fill="#7C2D12" opacity="0.3"/>
  <!-- Windows Grid Left -->
  <g fill="#FEF08A" opacity="0.6">
    <rect x="40" y="120" width="40" height="60" rx="4"/>
    <rect x="100" y="120" width="40" height="60" rx="4"/>
    <rect x="160" y="120" width="40" height="60" rx="4"/>
    <rect x="220" y="120" width="40" height="60" rx="4"/>
    <rect x="40" y="210" width="40" height="60" rx="4"/>
    <rect x="100" y="210" width="40" height="60" rx="4"/>
    <rect x="160" y="210" width="40" height="60" rx="4"/>
    <rect x="220" y="210" width="40" height="60" rx="4"/>
  </g>

  <!-- Right Building -->
  <rect x="880" y="60" width="320" height="460" fill="url(#brickGrad)" opacity="0.85"/>
  <g fill="#BAE6FD" opacity="0.7">
    <rect x="910" y="100" width="50" height="80" rx="4"/>
    <rect x="980" y="100" width="50" height="80" rx="4"/>
    <rect x="1050" y="100" width="50" height="80" rx="4"/>
    <rect x="910" y="210" width="50" height="80" rx="4"/>
    <rect x="980" y="210" width="50" height="80" rx="4"/>
    <rect x="1050" y="210" width="50" height="80" rx="4"/>
  </g>

  <!-- Greenery / Courtyard Lawn -->
  <path d="M 0 450 Q 600 420 1200 450 L 1200 675 L 0 675 Z" fill="#15803D" opacity="0.75"/>
  <circle cx="120" cy="400" r="140" fill="#166534" opacity="0.8"/>
  <circle cx="280" cy="420" r="110" fill="#15803D" opacity="0.8"/>
  <circle cx="1020" cy="410" r="130" fill="#166534" opacity="0.8"/>

  <!-- Center Outdoor Study Table & Students Silhouette Graphic -->
  <g transform="translate(480, 410)">
    <!-- Round Bench Table -->
    <ellipse cx="120" cy="180" rx="180" ry="24" fill="#CBD5E1"/>
    <ellipse cx="120" cy="170" rx="160" ry="20" fill="#F8FAFC"/>
    <rect x="110" y="180" width="20" height="70" fill="#64748B"/>

    <!-- 3 Students sitting around table with laptops -->
    <!-- Student 1 (Left) -->
    <circle cx="0" cy="80" r="22" fill="#334155"/>
    <path d="M -30 110 Q 0 100 20 160 L -40 180 Z" fill="#475569"/>
    <!-- Laptop -->
    <rect x="-10" y="140" width="40" height="25" rx="3" fill="#E2E8F0" transform="rotate(-10)"/>

    <!-- Student 2 (Center) -->
    <circle cx="120" cy="70" r="24" fill="#1E293B"/>
    <path d="M 90 100 Q 120 90 150 160 L 80 180 Z" fill="#3B82F6"/>
    <!-- Phone / Tablet -->
    <rect x="110" y="125" width="20" height="30" rx="3" fill="#06B6D4"/>

    <!-- Student 3 (Right) -->
    <circle cx="240" cy="85" r="22" fill="#334155"/>
    <path d="M 210 115 Q 240 105 270 165 L 190 185 Z" fill="#1E3A8A"/>
    <rect x="200" y="142" width="38" height="24" rx="3" fill="#E2E8F0" transform="rotate(8)"/>
  </g>

  <!-- FLOATING DASHBOARD OVERLAY CARD (Glassmorphism UI) -->
  <g transform="translate(450, 70)" filter="url(#dropShadow)">
    <rect width="520" height="380" rx="16" fill="url(#glassCard)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Dashboard Header -->
    <rect x="0" y="0" width="520" height="48" rx="16" fill="#0F172A" fill-opacity="0.8"/>
    <text x="24" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">CampusLink</text>
    <rect x="420" y="12" width="80" height="26" rx="13" fill="#06B6D4"/>
    <text x="460" y="29" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle">Log in dashboard</text>

    <!-- Sidebar Mini -->
    <rect x="16" y="64" width="110" height="300" rx="8" fill="#1E293B" fill-opacity="0.5"/>
    <rect x="24" y="80" width="94" height="28" rx="6" fill="#0284C7" fill-opacity="0.3"/>
    <text x="56" y="98" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#38BDF8">Dashboard</text>
    <text x="56" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Events</text>
    <text x="56" y="158" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Students</text>
    <text x="56" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Groups</text>

    <!-- Main Content inside overlay -->
    <text x="144" y="90" font-family="system-ui, sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Campus Dashboard</text>
    <text x="144" y="112" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#06B6D4">Student Hub</text>

    <!-- Grid Cards inside overlay -->
    <!-- Card 1: Events -->
    <rect x="144" y="126" width="110" height="100" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155"/>
    <text x="154" y="146" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Events</text>
    <text x="154" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Placement Drives</text>
    <text x="154" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Learning Forum</text>
    <rect x="154" y="194" width="60" height="20" rx="4" fill="#0284C7"/>
    <text x="184" y="207" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Learn More</text>

    <!-- Card 2: Study Groups -->
    <rect x="266" y="126" width="110" height="100" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155"/>
    <text x="276" y="146" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Study Groups</text>
    <text x="276" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Coding Circles</text>
    <text x="276" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Peer Prep</text>
    <rect x="276" y="194" width="60" height="20" rx="4" fill="#0284C7"/>
    <text x="306" y="207" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Study More</text>

    <!-- Card 3: News -->
    <rect x="388" y="126" width="116" height="100" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155"/>
    <text x="398" y="146" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">News</text>
    <text x="398" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Placement Updates</text>
    <text x="398" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Top Recruiters</text>
    <rect x="398" y="194" width="55" height="20" rx="4" fill="#0284C7"/>
    <text x="425" y="207" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Read More</text>

    <!-- Lower Section Card -->
    <rect x="144" y="240" width="360" height="110" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155"/>
    <text x="160" y="265" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Student Hub - Unified Career &amp; Campus Network</text>
    <text x="160" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Real-time drive notifications, skill readiness tracking, and company shortlists.</text>
    <circle cx="180" cy="315" r="12" fill="#06B6D4"/>
    <circle cx="220" cy="315" r="12" fill="#3B82F6"/>
    <circle cx="260" cy="315" r="12" fill="#8B5CF6"/>
  </g>

  <!-- OVERLAID TITLE BRANDING AT BOTTOM LEFT -->
  <g transform="translate(60, 520)">
    <text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1">
      Campus<tspan fill="#06B6D4">Link</tspan>
    </text>
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="28" fill="#E2E8F0" opacity="0.9">
      Your Entire Campus, Connected.
    </text>
  </g>
</svg>
