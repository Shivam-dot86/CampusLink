<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="wfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="node1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="node2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="node3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <linearGradient id="node4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="33%" stop-color="#8B5CF6"/>
      <stop offset="66%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="450" rx="16" fill="url(#wfBgGrad)" stroke="#334155" stroke-width="1"/>

  <!-- Connecting Backbone Path -->
  <path d="M 160 210 L 380 210 L 600 210 L 820 210" stroke="url(#lineGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.8"/>
  <path d="M 160 210 L 820 210" stroke="url(#lineGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Section Title -->
  <text x="500" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    End-to-End Campus-to-Corporate Placement Pipeline
  </text>
  <text x="500" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">
    Seamless automation from academic verification to corporate offer release
  </text>

  <!-- Step 1 Node: Academic Sync -->
  <g transform="translate(160, 210)">
    <circle cx="0" cy="0" r="48" fill="url(#node1Grad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="38" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <text x="0" y="-5" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🎓</text>
    <text x="0" y="15" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#60A5FA" text-anchor="middle">STEP 01</text>
    
    <!-- Title & Desc below -->
    <text x="0" y="75" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">APAAR &amp; ABC Sync</text>
    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Verified DigiLocker</text>
    <text x="0" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Academic Credits</text>
  </g>

  <!-- Step 2 Node: AI Fit Scoring -->
  <g transform="translate(380, 210)">
    <circle cx="0" cy="0" r="48" fill="url(#node2Grad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="38" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
    <text x="0" y="-5" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⚡</text>
    <text x="0" y="15" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#C084FC" text-anchor="middle">STEP 02</text>
    
    <text x="0" y="75" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">AI Match Engine</text>
    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Predictive Shortlists</text>
    <text x="0" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">&amp; Skill Readiness</text>
  </g>

  <!-- Step 3 Node: Drive Scheduler -->
  <g transform="translate(600, 210)">
    <circle cx="0" cy="0" r="48" fill="url(#node3Grad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="38" fill="#0F172A" stroke="#6366F1" stroke-width="2"/>
    <text x="0" y="-5" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">📅</text>
    <text x="0" y="15" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#818CF8" text-anchor="middle">STEP 03</text>
    
    <text x="0" y="75" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">Conflict-Free Drive</text>
    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Lab Allocation &amp;</text>
    <text x="0" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Ground Ops Control</text>
  </g>

  <!-- Step 4 Node: Offer & Onboarding -->
  <g transform="translate(820, 210)">
    <circle cx="0" cy="0" r="48" fill="url(#node4Grad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="38" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="-5" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">💼</text>
    <text x="0" y="15" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#34D399" text-anchor="middle">STEP 04</text>
    
    <text x="0" y="75" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">Offer Clearance</text>
    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Automated Document</text>
    <text x="0" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">KYC &amp; Corporate Joining</text>
  </g>

  <!-- Live Pulse Badge at top right -->
  <g transform="translate(850, 45)">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
    <circle cx="-40" cy="0" r="4" fill="#34D399"/>
    <text x="-28" y="4" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#34D399">100% Automated</text>
  </g>
</svg>
